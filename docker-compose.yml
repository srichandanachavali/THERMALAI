networks:
  thermalai:

volumes:
  backend-logs:

services:
  # ML prediction service (Flask RF+LSTM ensemble)
  ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: thermalai-ml
    ports:
      - "5001:5001"
    networks:
      - thermalai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # SCADA feed simulator — streams synthetic reactor readings into the backend
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: thermalai-simulator
    command: python stream_data.py
    environment:
      - BACKEND_URL=http://backend:5000
    networks:
      - thermalai
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

  # Express backend (port 5000 internal, proxied via nginx)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: thermalai-backend
    env_file:
      - ./backend/.env
    environment:
      - ML_URL=http://ml:5001
      - NODE_ENV=production
    volumes:
      - backend-logs:/app/logs
    networks:
      - thermalai
    depends_on:
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend SPA served by nginx (host port 3000)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: thermalai-frontend
    ports:
      - "3000:80"
    networks:
      - thermalai
    depends_on:
      - backend
