name: ThermalAI CI

# Run tests on push to main and on pull requests targeting main.
# The deploy job below triggers only on main, gated by branch ref.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ── Backend: Jest ───────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # Cache node_modules keyed on the lockfile so repeat runs are fast.
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run Jest test suite
        # --forceExit is baked into the npm test script (see package.json).
        run: npm test
        working-directory: backend

  # ── ML model: pytest ────────────────────────────────────────────────────
  test-ml:
    name: ML Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # requirements.txt is tensorflow-free (see the note at its top); it
        # also provides shap, which test_shap_explanation.py needs.
        run: pip install -r requirements.txt
        working-directory: ml-model

      - name: Run pytest
        run: pytest tests/ -v
        working-directory: ml-model

  # ── Frontend: react-scripts build ───────────────────────────────────────
  test-frontend:
    name: Frontend Build (react-scripts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend

  # ── Deploy: Render hooks (main only) ────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test-backend, test-ml, test-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger backend deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Trigger ML deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_ML }}"

      - name: Trigger frontend deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
